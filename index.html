<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>¿Me quieres?</title>
  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding-top: 100px;
      transition: background 1s ease;
    }
    .heart {
      font-size: 100px;
      color: red;
      animation: pulse 1s infinite;
      transition: transform 0.5s, color 0.5s;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .question {
      font-size: 24px;
      margin: 20px 0;
    }
    .buttons button {
      font-size: 20px;
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .yes {
      background-color: #ff4d4d;
      color: white;
    }
    .no {
      background-color: #cccccc;
      color: black;
    }
    .sad-message {
      display: none;
      font-size: 22px;
      color: #333;
      margin-top: 30px;
      opacity: 0;
      transition: opacity 1s ease;
    }
  </style>
</head>
<body>
  <div class="heart" id="heart">❤️</div>
  <div class="question" id="question">¿Me quieres?</div>
  <div class="buttons" id="buttons">
    <button class="yes" onclick="sendLove()">Sí</button>
    <button class="no" onclick="rejectLove()">No</button>
  </div>
  <div class="sad-message" id="sadMessage">💔 Tu “no” dejó el corazón en silencio…</div>

  <script>
    function sendLove() {
      window.location.href = "https://wa.me/5355015233?text=Te%20quiero%20mucho%20❤️";
    }

    function rejectLove() {
      document.body.style.background = "#999";
      const heart = document.getElementById("heart");
      heart.textContent = "💔";
      heart.style.color = "black";
      heart.style.animation = "none";
      document.getElementById("question").style.display = "none";
      document.getElementById("buttons").style.display = "none";
      const sad = document.getElementById("sadMessage");
      sad.style.display = "block";
      setTimeout(() => { sad.style.opacity = 1; }, 100);
    }
  </script>
</body>
</html>
